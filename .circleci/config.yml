version: 2.1
executors:
  erlang-26:
    docker:
      - image: library/erlang:26

jobs:
  compile-and-test:
    executor: erlang-26
    steps:
      - checkout
      - run:
          name: Install rebar3
          command: wget https://s3.amazonaws.com/rebar3/rebar3 && chmod +x rebar3 && mv rebar3 /usr/local/bin/
      - run:
          name: Compile and test
          command: rebar3 eunit
      - store_test_results:
          path: _build/test/logs

workflows:
  version: 2
  compile-and-test:
    jobs:
      - compile-and-test
